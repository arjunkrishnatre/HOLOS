<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">

<defs>

  <filter id="glow">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <radialGradient id="core">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="45%" stop-color="#AA3BFF"/>
    <stop offset="100%" stop-color="#AA3BFF"/>
  </radialGradient>

</defs>


<!-- Purple O ring -->

<circle
  cx="256"
  cy="256"
  r="140"
  fill="none"
  stroke="#AA3BFF"
  stroke-width="35"
  filter="url(#glow)"
/>


<!-- Center AI core -->

<circle
  cx="256"
  cy="256"
  r="35"
  fill="url(#core)"
  filter="url(#glow)"
/>


</svg>